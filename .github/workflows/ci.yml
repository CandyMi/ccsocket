# ====================================================================
#  CI workflow for libccsocket
#
#  Verifies:
#   - Builds shared library with C compiler
#   - Builds static library
#   - Runs all CTest tests
#   - Compiles all headers + smoke test as C++ (C++ embedding)
#   - Zero warnings with -Werror equivalents
#   - Static-link smoke test (Linux)
#   - 32-bit and 64-bit architectures
#   - Debian (Ubuntu) and CentOS 7
#   - MSVC, MinGW, GCC, Clang, AppleClang
# ====================================================================

name: CI

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  BUILD_TYPE: Release

jobs:
  # ==================================================================
  #  Linux — GCC, x86_64
  # ==================================================================
  linux-gcc:
    name: Linux (gcc, x86_64)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DBUILD_TESTING=ON
          -DCMAKE_C_COMPILER=gcc

      - name: Build (C)
        run: cmake --build build --parallel

      - name: Test (C)
        run: ctest --test-dir build --output-on-failure

      - name: Static-link smoke test
        run: |
          cmake -B build-static -DBUILD_TESTING=OFF -DBUILD_SHARED_LIBS=OFF -DCMAKE_C_COMPILER=gcc
          cmake --build build-static --parallel

      # --- C++ smoke: compile library .c files as C++ ---
      - name: C++ smoke — compile+link as C++
        run: |
          g++ -std=c++11 -I. -o /tmp/cxx_smoke \
            -x c++ ccsocket.c ccicmp.c ccdns.c \
            -x c++ - <<'PLAINTEXT'
            #include "ccsocket.h"
            #include "ccicmp.h"
            #include "ccdns.h"
            int main() {
                ccsocket_family_t ver = ccsocket_get_version("1.1.1.1");
                (void)ver;
                return 0;
            }
          PLAINTEXT

      # --- C++ smoke: header-only inclusion check ---
      - name: C++ smoke — header-only inclusion
        run: |
          g++ -std=c++11 -I. -o /tmp/cxx_include_check \
            -x c++ - <<'PLAINTEXT'
            #include "ccsocket.h"
            #include "ccicmp.h"
            #include "ccdns.h"
            int main() { return 0; }
          PLAINTEXT

  # ==================================================================
  #  Linux — Clang, x86_64
  # ==================================================================
  linux-clang:
    name: Linux (clang, x86_64)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DBUILD_TESTING=ON
          -DCMAKE_C_COMPILER=clang

      - name: Build (C)
        run: cmake --build build --parallel

      - name: Test (C)
        run: ctest --test-dir build --output-on-failure

      # --- C++ smoke ---
      - name: C++ smoke — compile+link as C++
        run: |
          clang++ -std=c++11 -I. -o /tmp/cxx_smoke \
            -x c++ ccsocket.c ccicmp.c ccdns.c \
            -x c++ - <<'PLAINTEXT'
            #include "ccsocket.h"
            #include "ccicmp.h"
            #include "ccdns.h"
            int main() {
                ccsocket_family_t ver = ccsocket_get_version("1.1.1.1");
                (void)ver;
                return 0;
            }
          PLAINTEXT

      - name: C++ smoke — header-only inclusion
        run: |
          clang++ -std=c++11 -I. -o /tmp/cxx_include_check \
            -x c++ - <<'PLAINTEXT'
            #include "ccsocket.h"
            #include "ccicmp.h"
            #include "ccdns.h"
            int main() { return 0; }
          PLAINTEXT

  # ==================================================================
  #  Linux — GCC, i686 (32-bit via multilib)
  # ==================================================================
  linux-32bit:
    name: Linux (gcc, i686)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install multilib
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-multilib g++-multilib

      - name: Configure (32-bit)
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DBUILD_TESTING=ON
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_C_FLAGS="-m32"
          -DCMAKE_CXX_FLAGS="-m32"

      - name: Build (C)
        run: cmake --build build --parallel

      - name: Test (C)
        run: ctest --test-dir build --output-on-failure

      # --- C++ smoke (32-bit) ---
      - name: C++ smoke — compile+link as C++
        run: |
          g++ -m32 -std=c++11 -I. -o /tmp/cxx_smoke \
            -x c++ ccsocket.c ccicmp.c ccdns.c \
            -x c++ - <<'PLAINTEXT'
            #include "ccsocket.h"
            #include "ccicmp.h"
            #include "ccdns.h"
            int main() {
                ccsocket_family_t ver = ccsocket_get_version("1.1.1.1");
                (void)ver;
                return 0;
            }
          PLAINTEXT

      - name: C++ smoke — header-only inclusion
        run: |
          g++ -m32 -std=c++11 -I. -o /tmp/cxx_include_check \
            -x c++ - <<'PLAINTEXT'
            #include "ccsocket.h"
            #include "ccicmp.h"
            #include "ccdns.h"
            int main() { return 0; }
          PLAINTEXT

  # ==================================================================
  #  CentOS 7 — GCC 4.8.5 (legacy platform)
  # ==================================================================
  centos7:
    name: CentOS 7 (x86_64)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build and test in CentOS 7 container
        run: |
          docker run --rm -v $PWD:/workspace -w /workspace centos:7 \
            sh -c "
              sed -i 's|mirror.centos.org|vault.centos.org|g' /etc/yum.repos.d/*.repo &&
              sed -i 's|^#baseurl|baseurl|' /etc/yum.repos.d/*.repo &&
              sed -i 's|^mirrorlist=|#mirrorlist=|' /etc/yum.repos.d/*.repo &&
              yum install -y -q epel-release &&
              yum install -y -q cmake3 gcc gcc-c++ make &&
              cmake3 -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_C_COMPILER=gcc &&
              cmake3 --build build --parallel &&
              ctest3 --test-dir build --output-on-failure
            "

      - name: C++ smoke - compile+link as C++
        run: |
          docker run --rm -v $PWD:/workspace -w /workspace centos:7 \
            sh -c "
              sed -i 's|mirror.centos.org|vault.centos.org|g' /etc/yum.repos.d/*.repo &&
              sed -i 's|^#baseurl|baseurl|' /etc/yum.repos.d/*.repo &&
              sed -i 's|^mirrorlist=|#mirrorlist=|' /etc/yum.repos.d/*.repo &&
              yum install -y -q epel-release &&
              yum install -y -q cmake3 gcc gcc-c++ make &&
              g++ -std=c++11 -I. -o /tmp/cxx_smoke -x c++ ccsocket.c ccicmp.c ccdns.c tests/test_ccsocket_cxx_embed.cpp
            "

      - name: C++ smoke - header-only inclusion
        run: |
          docker run --rm -v $PWD:/workspace -w /workspace centos:7 \
            sh -c "
              sed -i 's|mirror.centos.org|vault.centos.org|g' /etc/yum.repos.d/*.repo &&
              sed -i 's|^#baseurl|baseurl|' /etc/yum.repos.d/*.repo &&
              sed -i 's|^mirrorlist=|#mirrorlist=|' /etc/yum.repos.d/*.repo &&
              yum install -y -q epel-release &&
              yum install -y -q cmake3 gcc gcc-c++ make &&
              g++ -std=c++11 -I. -c -o /tmp/cxx_include_check.o tests/test_ccsocket_cxx_embed.cpp
            "

  # ==================================================================
  #  macOS — AppleClang, x86_64 (Intel)
  # ==================================================================
  macos-arm64:
    name: macOS (Apple Silicon, arm64)
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DBUILD_TESTING=ON

      - name: Build (C)
        run: cmake --build build --parallel

      - name: Test (C)
        run: ctest --test-dir build --output-on-failure

      # --- C++ smoke ---
      - name: C++ smoke — compile+link as C++
        run: |
          clang++ -std=c++11 -I. -o /tmp/cxx_smoke \
            -x c++ ccsocket.c ccicmp.c ccdns.c \
            -x c++ - <<'PLAINTEXT'
            #include "ccsocket.h"
            #include "ccicmp.h"
            #include "ccdns.h"
            int main() {
                ccsocket_family_t ver = ccsocket_get_version("1.1.1.1");
                (void)ver;
                return 0;
            }
          PLAINTEXT

      - name: C++ smoke — header-only inclusion
        run: |
          clang++ -std=c++11 -I. -o /tmp/cxx_include_check \
            -x c++ - <<'PLAINTEXT'
            #include "ccsocket.h"
            #include "ccicmp.h"
            #include "ccdns.h"
            int main() { return 0; }
          PLAINTEXT

  # ==================================================================
  #  Windows — MSVC, x64
  # ==================================================================
  windows-msvc-x64:
    name: Windows (MSVC, x64)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DBUILD_TESTING=ON

      - name: Build (C)
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Test (C)
        run: |
          $env:Path = "$PWD\build\${{ env.BUILD_TYPE }};$env:Path"
          ctest --test-dir build --output-on-failure -C ${{ env.BUILD_TYPE }}

      # C++ compatibility verified by Linux + macOS smoke tests above

  # ==================================================================
  #  Windows — MSVC, x86 (32-bit)
  # ==================================================================
  windows-msvc-x86:
    name: Windows (MSVC, x86)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DBUILD_TESTING=ON
          -A Win32

      - name: Build (C)
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Test (C)
        run: |
          $env:Path = "$PWD\build\${{ env.BUILD_TYPE }};$env:Path"
          ctest --test-dir build --output-on-failure -C ${{ env.BUILD_TYPE }}

      # C++ compatibility verified by Linux + macOS smoke tests above

  # ==================================================================
  #  Windows — MinGW-w64 (gcc), x86_64
  # ==================================================================
  windows-mingw64:
    name: Windows (MinGW, x64)
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            make

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DBUILD_TESTING=ON
          -G "Unix Makefiles"

      - name: Build (C)
        run: cmake --build build --parallel

      - name: Test (C)
        run: |
          export PATH="$PWD/build:$PATH"
          ctest --test-dir build --output-on-failure

      # --- C++ smoke ---
      - name: C++ smoke — compile+link as C++
        run: |
          g++ -std=c++11 -I. -o /tmp/cxx_smoke \
            -x c++ ccsocket.c ccicmp.c ccdns.c -lws2_32 \
            -x c++ - <<'PLAINTEXT'
            #include "ccsocket.h"
            #include "ccicmp.h"
            #include "ccdns.h"
            int main() {
                ccsocket_family_t ver = ccsocket_get_version("1.1.1.1");
                (void)ver;
                return 0;
            }
          PLAINTEXT

      - name: C++ smoke — header-only inclusion
        run: |
          g++ -std=c++11 -I. -o /tmp/cxx_include_check \
            -x c++ - <<'PLAINTEXT'
            #include "ccsocket.h"
            #include "ccicmp.h"
            #include "ccdns.h"
            int main() { return 0; }
          PLAINTEXT

  # ==================================================================
  #  Windows — MinGW-w64 (gcc), i686 (32-bit)
  # ==================================================================
  windows-mingw32:
    name: Windows (MinGW, i686)
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            mingw-w64-i686-cmake
            mingw-w64-i686-gcc
            make

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DBUILD_TESTING=ON
          -G "Unix Makefiles"

      - name: Build (C)
        run: cmake --build build --parallel

      - name: Test (C)
        run: |
          export PATH="$PWD/build:$PATH"
          ctest --test-dir build --output-on-failure

      # --- C++ smoke ---
      - name: C++ smoke — compile+link as C++
        run: |
          g++ -std=c++11 -I. -o /tmp/cxx_smoke \
            -x c++ ccsocket.c ccicmp.c ccdns.c -lws2_32 \
            -x c++ - <<'PLAINTEXT'
            #include "ccsocket.h"
            #include "ccicmp.h"
            #include "ccdns.h"
            int main() {
                ccsocket_family_t ver = ccsocket_get_version("1.1.1.1");
                (void)ver;
                return 0;
            }
          PLAINTEXT

      - name: C++ smoke — header-only inclusion
        run: |
          g++ -std=c++11 -I. -o /tmp/cxx_include_check \
            -x c++ - <<'PLAINTEXT'
            #include "ccsocket.h"
            #include "ccicmp.h"
            #include "ccdns.h"
            int main() { return 0; }
          PLAINTEXT
